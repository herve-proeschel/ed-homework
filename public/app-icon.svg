<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background gradient matching ÉcoleDirecte primary blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e5a99"/>
      <stop offset="100%" stop-color="#083b64"/>
    </linearGradient>

    <!-- Pencil gradient -->
    <linearGradient id="pencilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Shadow filter for depth -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle (maskable safe area compliant) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Homework Planner / Notebook Group with shadow -->
  <g filter="url(#shadow)">
    <!-- Notebook white page sheet -->
    <rect x="106" y="80" width="300" height="352" rx="20" fill="#ffffff"/>

    <!-- Notebook spine / binding (ÉcoleDirecte Navy Blue) -->
    <path d="M 106,100 A 20,20 0 0 1 126,80 L 148,80 L 148,432 L 126,432 A 20,20 0 0 1 106,412 Z" fill="#0b4e84"/>
    
    <!-- Spine binding spirals / rings -->
    <g fill="#94a3b8">
      <rect x="140" y="112" width="16" height="8" rx="4"/>
      <rect x="140" y="156" width="16" height="8" rx="4"/>
      <rect x="140" y="200" width="16" height="8" rx="4"/>
      <rect x="140" y="244" width="16" height="8" rx="4"/>
      <rect x="140" y="288" width="16" height="8" rx="4"/>
      <rect x="140" y="332" width="16" height="8" rx="4"/>
      <rect x="140" y="376" width="16" height="8" rx="4"/>
    </g>

    <!-- Notebook header banner (ÉcoleDirecte Sky Blue) -->
    <path d="M 148,80 L 386,80 A 20,20 0 0 1 406,100 L 406,138 L 148,138 Z" fill="#0284c7"/>

    <!-- Header title bar representation -->
    <rect x="176" y="102" width="130" height="14" rx="7" fill="#ffffff" opacity="0.95"/>

    <!-- Task 1: Completed checkmark (Green) -->
    <circle cx="192" cy="184" r="14" fill="#10b981"/>
    <path d="M 186,184 L 190,189 L 198,179" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="220" y="178" width="150" height="12" rx="6" fill="#475569"/>

    <!-- Task 2: Completed checkmark (Green) -->
    <circle cx="192" cy="236" r="14" fill="#10b981"/>
    <path d="M 186,236 L 190,241 L 198,231" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="220" y="230" width="125" height="12" rx="6" fill="#475569"/>

    <!-- Task 3: In progress bullet (Blue) -->
    <circle cx="192" cy="288" r="14" fill="#0284c7"/>
    <path d="M 186,288 L 198,288" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="220" y="282" width="140" height="12" rx="6" fill="#475569"/>

    <!-- Task 4 & 5: Homework notes lines -->
    <rect x="176" y="340" width="184" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="176" y="370" width="130" height="10" rx="5" fill="#e2e8f0"/>
  </g>

  <!-- Stylized Homework Pencil in foreground -->
  <g transform="translate(335, 275) rotate(-35)" filter="url(#shadow)">
    <!-- Body -->
    <rect x="-14" y="-85" width="28" height="155" rx="3" fill="url(#pencilGrad)"/>
    <!-- Pencil highlight facet -->
    <rect x="-4" y="-85" width="8" height="155" fill="#fef3c7" opacity="0.4"/>
    <!-- Ferrule (metal band) -->
    <rect x="-14" y="-101" width="28" height="16" fill="#94a3b8"/>
    <!-- Eraser -->
    <path d="M -14,-101 Q -14,-118 0,-118 Q 14,-118 14,-101 Z" fill="#f43f5e"/>
    <!-- Wood tip -->
    <polygon points="-14,70 14,70 0,108" fill="#fed7aa"/>
    <!-- Graphite lead point -->
    <polygon points="-5,94 5,94 0,108" fill="#1e293b"/>
  </g>
</svg>
