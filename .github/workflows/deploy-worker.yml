name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ed-cors-proxy
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ secrets['CLOUDFLARE_WORKER_NAME'] }}
          ALLOWED_ORIGINS: ${{ secrets['ALLOWED_ORIGINS'] }}
        run: npx --yes wrangler@4 deploy --name "$CLOUDFLARE_WORKER_NAME" --var "ALLOWED_ORIGINS:$ALLOWED_ORIGINS"